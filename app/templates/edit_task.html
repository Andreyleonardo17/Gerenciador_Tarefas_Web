<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Tarefa - TaskFlow</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1521790945508-bf2a36314e85');
      background-size: cover;
      background-position: center;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    .form-container {
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 1rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #ff7a00;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-control::placeholder {
      color: #ccc;
    }

    .btn-primary {
      background-color: #ff7a00;
      border: none;
    }

    .btn-primary:hover {
      background-color: #e36800;
    }

    .btn-secondary {
      background-color: #888;
      border: none;
    }

    .btn-secondary:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="form-container">
    <h1>Edite a Task</h1>
    <form action="" method="post">
      <div class="mb-3">
        <label for="titulo" class="form-label fw-bold">Título:</label>
        <input type="text" id="titulo" name="titleForm" class="form-control bg-dark text-white border-0" placeholder="{{ tarefa.title }}" required>
      </div>

      <div class="mb-4">
        <label for="descricao" class="form-label fw-bold">Descrição:</label>
        <textarea id="descricao" name="descriptionForm" class="form-control bg-dark text-white border-0" rows="3" placeholder="{{ tarefa.description }}"></textarea>
      </div>

      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary w-100">Editar</button>
        <a href="/tasks" class="btn btn-secondary w-100">Cancelar</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
