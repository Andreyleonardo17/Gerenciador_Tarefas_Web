<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar - TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #ff7a00;
      --secondary: #1e1e2f;
      --light: #ffffff;
      --overlay: rgba(0, 0, 0, 0.6);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: var(--light);
      background-image: url('https://images.unsplash.com/photo-1521790945508-bf2a36314e85');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .overlay {
      background-color: var(--overlay);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    .form-container {
      position: relative;
      z-index: 1;
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--primary);
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--light);
    }

    .form-control::placeholder {
      color: #ccc;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: var(--primary);
    }

    .btn-primary {
      background-color: var(--primary);
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #e36800;
      transform: scale(1.03);
    }

    .input-group-text {
      background-color: transparent;
      border: none;
      cursor: pointer;
      color: #ccc;
    }

    .input-group svg {
      width: 20px;
      height: 20px;
    }

    .forgot-password {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .forgot-password:hover {
      text-decoration: underline;
      color: #e36800;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="form-container">
    <h1>Acesse sua conta</h1>
    <form action="" method="post">
      <div class="mb-3">
        <label for="emailForm" class="form-label fw-bold">Email:</label>
        <input type="text" name="emailForm" id="emailForm" class="form-control" placeholder="seu@email.com" required>
      </div>

      <div class="mb-3">
        <label for="senhaForm" class="form-label fw-bold">Senha:</label>
        <div class="input-group">
          <input type="password" name="senhaForm" id="senhaForm" class="form-control" placeholder="Sua senha" required>
          <span class="input-group-text" onclick="togglePassword('senhaForm', this)">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="mb-3 text-end">
        <a href="/recuperar-senha" class="forgot-password">Esqueci minha senha</a>
      </div>

      <input type="submit" class="btn btn-primary w-100" value="Acessar">
    </form>
  </div>

  <script>
    function togglePassword(id, el) {
      const field = document.getElementById(id);
      const icon = el.querySelector('svg');
      const isVisible = field.type === "text";
      field.type = isVisible ? "password" : "text";
      icon.innerHTML = isVisible
        ? `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`
        : `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.57 21.57 0 0 1 5.17-5.57M9.88 9.88A3 3 0 0 1 14.12 14.12M1 1l22 22"/>`;
    }
  </script>
</body>
</html>
