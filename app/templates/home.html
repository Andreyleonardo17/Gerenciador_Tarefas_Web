<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow - Organize sua vida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #ff7a00;
      --secondary: #1e1e2f;
      --light: #ffffff;
      --overlay: rgba(0, 0, 0, 0.6);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: var(--light);
      background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .overlay {
      background-color: var(--overlay);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    .glass-container {
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .left-section {
      background-color: rgba(30, 30, 47, 0.7);
    }

    .left-section h1 {
      color: var(--primary);
    }

    .btn-custom {
      background-color: var(--primary);
      color: white;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      transition: 0.3s ease;
      width: 200px;
    }

    .btn-custom:hover {
      background-color: #e36800;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="container glass-container d-flex flex-column flex-md-row p-0" style="max-width: 1000px; width: 90%;">
    <div class="left-section d-flex flex-column justify-content-center p-5 col-md-6">
      <h1 class="mb-4 display-5">TaskFlow</h1>
      <p class="fs-5">Organize sua vida com eficiência. Gerencie tarefas, ganhe produtividade e mantenha o foco no que realmente importa.</p>
    </div>
    <div class="d-flex flex-column justify-content-center align-items-center p-5 col-md-6 bg-white bg-opacity-10">
      <a href="/login" class="btn btn-custom mb-3 text-decoration-none text-center">Login</a>
      <a href="/register" class="btn btn-custom text-decoration-none text-center">Registre-se</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
