<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmar Exclusão - TaskFlow</title>
  <style>
    :root {
      --primary: #ff7a00;
      --secondary: #1e1e2f;
      --light: #ffffff;
      --overlay: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: var(--light);
      background-image: url('https://images.unsplash.com/photo-1521790945508-bf2a36314e85');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .overlay {
      background-color: var(--overlay);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    .form-container {
      position: relative;
      z-index: 1;
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: var(--primary);
    }

    p {
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s ease;
      width: 100%;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #e36800;
      transform: scale(1.03);
    }

    .btn.cancel {
      background-color: #888;
    }

    .btn.cancel:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="form-container">
    <h1>Confirmar Exclusão</h1>
    <p>Você tem certeza que deseja excluir a tarefa <strong>"{{tarefa.title}}"</strong>?</p>

    <form action="{{ url_for('routes.delete_task', id=tarefa.id) }}" method="POST">
      <div class="button-group">
        <button type="submit" class="btn">Sim, excluir</button>
        <a href="{{ url_for('routes.task') }}" class="btn cancel">Cancelar</a>
      </div>
    </form>
  </div>
</body>
</html>
